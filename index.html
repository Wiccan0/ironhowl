<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>ironhowlme</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 15% 5%, rgba(0,128,255,.18), transparent 25%),
      radial-gradient(circle at 85% 92%, rgba(94,64,255,.18), transparent 27%),
      linear-gradient(180deg, #02040a 0%, #03050b 45%, #02040a 100%);
    overflow-x: hidden;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(.2px);
    opacity: .95;
  }
  .orb.top {
    width: 360px; height: 360px;
    left: -220px; top: -210px;
    border: 2px solid rgba(50,150,255,.8);
    box-shadow: 0 0 55px rgba(0,115,255,.55), inset 0 0 40px rgba(0,60,150,.25);
    background: radial-gradient(circle at 70% 70%, rgba(0,80,180,.18), transparent 62%);
  }
  .orb.bottom {
    width: 430px; height: 430px;
    right: -290px; bottom: -250px;
    border: 2px solid rgba(105,90,255,.65);
    box-shadow: 0 0 65px rgba(55,105,255,.35);
    background: radial-gradient(circle at 30% 30%, rgba(70,60,170,.22), transparent 65%);
  }

  main {
    width: min(100%, 520px);
    margin: 0 auto;
    padding: max(48px, env(safe-area-inset-top)) 24px max(48px, env(safe-area-inset-bottom));
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .avatar-wrap {
    width: 205px;
    height: 205px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #37d7ff, #2f7cff 58%, #8458ff);
    box-shadow:
      0 0 28px rgba(26,153,255,.5),
      0 0 60px rgba(20,70,200,.18);
  }
  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 45%;
    display: block;
    border: 3px solid #050813;
  }

  h1 {
    margin: 34px 0 0;
    font-size: clamp(38px, 11vw, 58px);
    line-height: 1;
    letter-spacing: -2.2px;
    font-weight: 800;
    text-align: center;
    text-shadow: 0 0 22px rgba(255,255,255,.07);
  }
  .age {
    margin-top: 14px;
    font-size: 22px;
    color: rgba(218,224,255,.66);
    letter-spacing: .4px;
  }

  .links {
    width: 100%;
    margin-top: 44px;
    display: grid;
    gap: 18px;
  }

  .card {
    text-decoration: none;
    color: inherit;
    width: 100%;
    min-height: 98px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: linear-gradient(180deg, rgba(16,23,42,.84), rgba(9,12,25,.88));
    transform: translateZ(0);
    transition: transform .16s ease, filter .16s ease;
  }
  .card:active { transform: scale(.985); }
  .telegram {
    border: 1.5px solid rgba(52,171,255,.9);
    box-shadow:
      0 0 0 1px rgba(45,151,255,.12) inset,
      0 0 26px rgba(0,145,255,.28);
  }
  .instagram {
    border: 1.5px solid rgba(255,89,185,.9);
    box-shadow:
      0 0 0 1px rgba(255,100,175,.10) inset,
      0 0 26px rgba(209,55,255,.23);
  }
  .telegram::before,
  .instagram::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .4;
    pointer-events: none;
  }
  .telegram::before {
    background: linear-gradient(120deg, rgba(0,180,255,.18), transparent 35%, rgba(40,80,255,.12));
  }
  .instagram::before {
    background: linear-gradient(120deg, rgba(255,0,170,.16), transparent 35%, rgba(255,133,40,.11));
  }

  .icon {
    flex: 0 0 62px;
    width: 62px; height: 62px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    z-index: 1;
  }
  .telegram .icon {
    background: linear-gradient(160deg, #42c9ff, #0f7dff);
    box-shadow: 0 0 24px rgba(26,160,255,.5);
  }
  .instagram .icon {
    background:
      radial-gradient(circle at 32% 98%, #ffd35a 0 20%, transparent 21%),
      radial-gradient(circle at 20% 95%, #ff7a3d 0 35%, transparent 36%),
      radial-gradient(circle at 90% 0%, #7c42ff 0 45%, transparent 46%),
      linear-gradient(135deg, #ff4fb7, #ff6b5e 58%, #6c48ff);
    box-shadow: 0 0 24px rgba(255,72,180,.45);
  }
  .icon svg { width: 34px; height: 34px; display: block; }

  .copy {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 1;
  }
  .title {
    font-size: 23px;
    font-weight: 760;
    letter-spacing: -.4px;
  }
  .sub {
    margin-top: 4px;
    font-size: 16px;
    color: rgba(200,211,255,.66);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .arrow {
    font-size: 38px;
    line-height: 1;
    color: rgba(255,255,255,.76);
    transform: translateY(-2px);
    position: relative;
    z-index: 1;
  }

  .hint {
    margin-top: 28px;
    font-size: 13px;
    color: rgba(255,255,255,.32);
    text-align: center;
  }

  @media (max-width: 390px) {
    main { padding-left: 18px; padding-right: 18px; }
    .avatar-wrap { width: 180px; height: 180px; }
    .card { min-height: 92px; border-radius: 25px; padding: 16px 18px; }
    .icon { width: 56px; height: 56px; flex-basis: 56px; }
    .title { font-size: 21px; }
    .sub { font-size: 15px; }
  }
</style>
</head>
